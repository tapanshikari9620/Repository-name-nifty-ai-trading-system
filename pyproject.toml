[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "upstox-project"
version = "0.1.0"
description = "NIFTY options market data collection and analysis scripts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-dotenv",
    "tzdata",
]

[project.optional-dependencies]
websocket = ["upstox-python-sdk"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["upstox_project*"]
