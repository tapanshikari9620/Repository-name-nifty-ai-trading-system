[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "upstox-project"
version = "0.1.0"
description = "NIFTY options market data collection and analysis scripts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-dotenv",
    "tzdata",
]

[project.optional-dependencies]
websocket = ["upstox-python-sdk"]

[tool.setuptools]
py-modules = [
    "application_health_check",
    "check_option_features_schema",
    "collection_health",
    "config",
    "daily_data_quality_report",
    "database_backup",
    "database_schema_inspection",
    "dataset_quality",
    "display",
    "evidence_analysis_live",
    "evidence_engine",
    "experimental_variable_chain_builder",
    "feature_compatibility_audit",
    "feature_engine",
    "feature_test_live",
    "feature_universe_consistency_test",
    "feature_universe_pair_consistency_test",
    "feature_validation_live",
    "feature_validator",
    "historical_feature_builder",
    "historical_feature_store",
    "historical_feature_validation",
    "historical_outcome_builder",
    "leakage_test",
    "main",
    "market_analysis_live",
    "market_analyzer",
    "market_snapshot",
    "market_snapshot_inspection",
    "market_snapshot_live",
    "market_snapshot_test",
    "market_snapshot_validation",
    "missing_feature_time_audit",
    "ml_dataset_validation",
    "option_analysis",
    "option_chain",
    "option_record_validation",
    "option_snapshot",
    "option_snapshot_collector",
    "option_snapshot_inspection",
    "option_snapshot_inspection_v2",
    "option_snapshot_test",
    "option_snapshot_validation",
    "outcome_engine",
    "outcome_live",
    "pipeline_freshness_coverage_test",
    "qa_final_test",
    "signal_analysis_live",
    "signal_engine",
    "signal_logger",
    "signal_logging_live",
    "test_experimental_variable_chain_builder",
    "test_historical_feature_builder_variable_chains",
    "test_market_snapshot_inspection",
    "test_ml_readiness",
    "upstox_api",
    "variable_chain_eligibility_audit",
    "verify_fixes",
    "websocket_test",
]
include-package-data = false
